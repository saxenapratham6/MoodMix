name: MoodMixiOS
options:
  bundleIdPrefix: com.saxenapratham
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  MoodMixCore:
    path: ..
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    # Your Apple ID's Personal Team, so regenerating the project keeps signing set up.
    DEVELOPMENT_TEAM: 5VL3LD9W46
    CODE_SIGN_STYLE: Automatic
targets:
  MoodMixiOS:
    type: application
    platform: iOS
    sources: [MoodMixiOS]
    dependencies:
      - package: MoodMixCore
        product: MoodMixCore
      - target: MoodMixWidgets
    info:
      path: MoodMixiOS/Info.plist
      properties:
        CFBundleDisplayName: MoodMix
        CFBundleName: MoodMix
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        LSApplicationQueriesSchemes: [spotify]
        CFBundleURLTypes:
          - CFBundleURLName: com.saxenapratham.moodmix
            CFBundleURLSchemes: [moodmix]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.saxenapratham.moodmix.labels
            UTTypeDescription: MoodMix labels
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [moodmixlabels]
        CFBundleDocumentTypes:
          - CFBundleTypeName: MoodMix labels
            LSHandlerRank: Owner
            LSItemContentTypes: [com.saxenapratham.moodmix.labels]
        LSSupportsOpeningDocumentsInPlace: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.saxenapratham.moodmix
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  MoodMixWidgets:
    type: app-extension
    platform: iOS
    sources: [MoodMixWidgets]
    info:
      path: MoodMixWidgets/Info.plist
      properties:
        CFBundleDisplayName: MoodMix
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.saxenapratham.moodmix.widgets
